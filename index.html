<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080808" />
    <script>
      // Sets the theme before first paint so there is no flash: saved choice, else the system preference.
      try {
        var t = localStorage.getItem('snairk-theme');
        if (t !== 'light' && t !== 'dark') t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--head:start-->
    <title>SNAIRK — Eight AIs. Zero useful answers. Infinite snairk.</title>
    <meta name="description" content="Eight AIs. Zero useful answers. Pick ChatGPT, Claude, Gemini, Grok, Copilot, Perplexity, Meta AI, or SNAIRK (all of them at random) and get snairked." />
    <!--head:end-->
    <script type="module" src="/src/main.jsx"></script>
  </head>

  </body>
</html>
